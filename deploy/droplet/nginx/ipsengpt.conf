# /etc/nginx/sites-available/ipsengpt (installed by setup.sh)
#
# Traffic arrives via Cloudflare (proxied DNS). Real client IPs are restored
# from CF-Connecting-IP by /etc/nginx/conf.d/cloudflare-realip.conf, so
# $remote_addr below is the guest, not Cloudflare. The app trusts only this
# loopback proxy for X-Forwarded-For.

server {
    listen 80;
    listen [::]:80;
    server_name artifical.ipsen.no;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # No http2: Ubuntu 24.04 ships Nginx 1.24 (no `http2 on;`), and Cloudflare
    # talks HTTP/1.1 to the origin anyway. Guests still get HTTP/2 or 3 from Cloudflare.
    server_name artifical.ipsen.no;

    # Issued by certbot with the Cloudflare DNS plugin (see README).
    ssl_certificate     /etc/letsencrypt/live/artifical.ipsen.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artifical.ipsen.no/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ipsengpt:10m;

    # Small default; the original-photo route below allows more.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Set here once: a proxy_set_header inside a location would drop all of these.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # Server-sent events (chat stream, and live events from Phase 5):
    # never buffer, never compress, allow hour-long connections.
    location = /api/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location = /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    # Original (full-size) photo uploads, Phase 4. Max 20 MB + overhead.
    location /api/photos/ {
        proxy_pass http://127.0.0.1:3000;
        client_max_body_size 25m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
