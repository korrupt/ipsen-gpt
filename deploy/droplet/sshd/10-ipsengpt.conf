# /etc/ssh/sshd_config.d/10-ipsengpt.conf (installed by setup.sh)
# sshd keeps the FIRST value it reads for each option. This file sorts before
# Ubuntu cloud images' 50-cloud-init.conf, which may enable passwords.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
GatewayPorts no
X11Forwarding no

# The PC's reverse tunnel: may only listen on 127.0.0.1:11435, nothing else.
# (Also enforced per key in ~tunnel/.ssh/authorized_keys.)
Match User tunnel
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:11435
    PermitOpen none
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
    # Drop dead tunnels fast so the PC can reclaim the port after a network blip.
    ClientAliveInterval 15
    ClientAliveCountMax 3
